<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>潜力罗盘 · 个人优势探索</title>
<style>
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --primary: #2ea87c;
    --primary-d: #1f8a63;
    --primary-l: #e6f6f0;
    --ink: #1f2233;
    --ink-2: #4a4f66;
    --ink-3: #8b8fa3;
    --line: #e8eaf0;
    --gold: #f0a020;
    --green: #34c77b;
    --red: #ef4b5c;
    --radius: 16px;
    --shadow: 0 6px 20px rgba(31,34,51,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
    min-height: 100vh; padding: 16px 12px 40px;
    line-height: 1.6;
  }
  #app { width: 100%; max-width: 520px; }
  .hidden { display: none !important; }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 18px; margin-bottom: 14px;
  }
  .hero-title { font-size: 26px; font-weight: 800; line-height: 1.35; margin-bottom: 10px; letter-spacing: -.3px; }
  .hero-sub { font-size: 14px; color: var(--ink-2); margin-bottom: 22px; }
  .dim-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 22px; }
  .dim-item {
    background: var(--primary-l); border-radius: 10px; padding: 10px;
    font-size: 13px; font-weight: 600; color: var(--primary-d); text-align: center;
  }
  .btn {
    display: block; width: 100%; border: none; border-radius: 12px;
    padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all .18s; font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { transform: scale(.98); background: var(--primary-d); }
  .btn-ghost { background: #fff; color: var(--ink-3); border: 1px solid var(--line); }
  .btn-ghost:active { background: #f5f6fa; }

  .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
  .progress-bar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 24px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#5bc9a0,#2ea87c); border-radius: 4px; transition: width .3s; width: 0; }
  .q-text { font-size: 18px; font-weight: 600; line-height: 1.6; margin-bottom: 20px; min-height: 58px; }
  .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 22px; }
  .option {
    display: flex; align-items: center; gap: 11px; padding: 13px 15px;
    border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer;
    transition: all .16s; font-size: 14.5px;
  }
  .option:active { background: #f8f9fc; }
  .option.selected { border-color: var(--primary); background: var(--primary-l); font-weight: 600; }
  .option .dot {
    width: 19px; height: 19px; border-radius: 50%; border: 2px solid #ccd2e0;
    flex-shrink: 0; position: relative; transition: all .16s;
  }
  .option.selected .dot { border-color: var(--primary); background: var(--primary); }
  .option.selected .dot::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 9px; height: 9px; border-radius: 50%; background: #fff;
  }
  .nav-row { display: flex; gap: 10px; }

  .score-info { padding: 4px 2px; }
  .tname { font-size: 21px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.3px; }
  .kw-tags { font-size: 13px; color: var(--ink-3); margin-bottom: 16px; }
  .rank-line { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 14px; }
  .rk-badge {
    font-size: 11px; background: var(--primary-l); color: var(--primary-d);
    padding: 2px 8px; border-radius: 6px; font-weight: 700;
  }
  .rank-line b { font-weight: 700; }
  .rk-score { margin-left: auto; color: var(--ink-3); font-size: 13px; }
  .core-mode {
    margin-top: 14px; padding: 12px 14px; background: #f4faf7;
    border-radius: 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2);
  }
  .core-mode b { display: block; margin-bottom: 4px; color: var(--ink); }

  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .sec-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .sec-ico {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 7px;
    background: var(--primary-l); color: var(--primary-d); font-size: 13px;
  }
  .sec-sub { font-size: 12px; color: var(--ink-3); margin-left: auto; }

  .combo-box { background: #f4faf7; border-radius: 12px; padding: 14px; font-size: 13.5px; }
  .combo-box > b { display: block; margin-bottom: 6px; }
  .combo-box p { color: var(--ink-2); margin-bottom: 10px; line-height: 1.7; }
  .fit-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12.5px; }
  .fit-ok { color: var(--green); font-weight: 700; }
  .fit-no { color: var(--red); font-weight: 700; }
  .chip {
    display: inline-block; background: #fff; border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 20px; font-size: 12px; color: var(--ink-2);
  }

  .bar-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; }
  .letter { width: 16px; color: var(--ink-3); font-weight: 700; font-size: 12px; }
  .nm { width: 60px; font-weight: 600; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar-track i { display: block; height: 100%; background: linear-gradient(90deg,#5bc9a0,#2ea87c); border-radius: 4px; transition: width .6s; }
  .sc { width: 22px; text-align: right; font-weight: 700; color: var(--primary-d); }
  .tg { font-size: 11px; padding: 2px 6px; border-radius: 5px; flex-shrink: 0; width: 68px; text-align: center; }
  .tg.hi { background: #ffe8e8; color: #d63a4a; }
  .tg.mid { background: #fff3e0; color: #c47a00; }
  .tg.lo { background: #f0f1f5; color: #8b8fa3; }

  .type-name-row { margin-bottom: 8px; }
  .type-name-row .tn { font-size: 18px; font-weight: 800; }
  .type-skill { margin-top: 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
  .type-skill b { color: var(--ink); }
  .type-warn {
    margin-top: 10px; padding: 10px 12px; background: #fff8ed;
    border-left: 3px solid var(--gold); border-radius: 8px;
    font-size: 13px; color: #7a5a1f;
  }

  .quick-cards { display: flex; flex-direction: column; gap: 12px; }
  .quick-card { background: #f0f9f5; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .quick-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .quick-head .e { font-size: 22px; }
  .quick-head b { display: block; font-size: 14.5px; }
  .stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; display: block; }
  .ss { font-size: 11.5px; color: var(--ink-3); }
  .quick-slogan { font-size: 13px; color: var(--primary-d); font-weight: 600; margin-bottom: 10px; padding: 8px 10px; background: var(--primary-l); border-radius: 8px; }
  .qc-title { font-size: 12.5px; font-weight: 700; margin: 8px 0 5px; }
  .qc-title.yes { color: var(--green); }
  .qc-title.no { color: var(--red); }
  .qc-ok, .qc-warn { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 6px; margin: 2px 4px 2px 0; }
  .qc-ok { background: #e8f9f0; color: #1a8a52; }
  .qc-warn { background: #fff0f1; color: #c73a4a; }
  .qc-more { margin-top: 10px; }
  .qc-more summary {
    cursor: pointer; font-size: 13px; color: var(--primary-d); font-weight: 600;
    list-style: none; padding: 8px 12px; background: var(--primary-l);
    border-radius: 8px; text-align: center;
  }
  .qc-more summary::-webkit-details-marker { display: none; }
  .qc-more[open] summary { margin-bottom: 10px; }
  .qc-detail { font-size: 13px; line-height: 1.75; color: var(--ink-2); }
  .qc-detail p { margin-bottom: 10px; }
  .d-sec { margin-bottom: 10px; }
  .d-sec b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 13px; }
  .d-list { padding-left: 18px; }
  .d-list li { margin-bottom: 3px; }
  .syn-row { padding: 6px 10px; background: #fff; border-radius: 8px; margin-bottom: 4px; font-size: 12.5px; border: 1px solid var(--line); }
  .syn-row b { color: var(--primary-d); }
  .work-mode { margin-top: 10px; padding: 10px 12px; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  .work-mode b { display: block; margin-bottom: 4px; }
  .work-mode p { font-size: 12.5px; color: var(--ink-2); }

  .grow-one { display: flex; align-items: center; gap: 8px; padding: 9px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
  .grow-one:last-child { border-bottom: none; }
  .grow-one b { width: 60px; flex-shrink: 0; }
  .g-txt { flex: 1; color: var(--ink-2); font-size: 12.5px; }
  .grow-one .sc { color: var(--ink-3); }

  .career-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
  .career-cell { background: #f0f9f5; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ch .rk {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; background: var(--primary); color: #fff;
    border-radius: 50%; font-size: 11px; font-weight: 700; margin-right: 6px;
  }
  .ch b { font-size: 14px; }
  .ch .stars { font-size: 11px; }
  .career-cell .why, .career-cell .cd, .career-cell .risk, .career-cell .cs { font-size: 12.5px; color: var(--ink-2); margin: 3px 0; }
  .career-cell .risk { color: #c47a00; }

  .caution-item { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .caution-item:last-child { border-bottom: none; }
  .caution-item b { color: var(--ink); }

  .plan-line { padding: 8px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .plan-line:last-of-type { border-bottom: none; }
  .plan-line .day { color: var(--primary-d); font-weight: 700; width: 62px; flex-shrink: 0; }
  .compare-note { margin-top: 10px; padding: 10px 12px; background: #f4faf7; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); }

  .read-tip {
    background: #fff; border-radius: var(--radius); padding: 14px 16px;
    font-size: 12.5px; color: var(--ink-3); line-height: 1.75;
    box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .read-tip b { display: block; margin-bottom: 5px; color: var(--ink-2); font-size: 13px; }
  .read-tip i {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; background: var(--primary-l);
    color: var(--primary-d); font-style: normal; font-weight: 700;
    font-size: 11px; margin-right: 5px; vertical-align: middle;
  }
  .disclaimer {
    background: #f8f9fc;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 11.5px;
    color: var(--ink-3);
    line-height: 1.7;
    margin-bottom: 12px;
    text-align: center;
  }
  .disclaimer b {
    display: block;
    margin-bottom: 4px;
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 700;
  }
  .rp-foot { text-align: center; font-size: 12px; color: var(--ink-3); margin: 12px 0; }
  .body-text { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
</style>
</head>
<body>
<div id="app">

  <section id="screen-home">
    <div class="card">
      <h1 class="hero-title">潜力罗盘<br>找到你的优势方向</h1>
      <p class="hero-sub">通过 50 道题，从 10 个维度了解自己的优势倾向，生成一份职业发展参考。</p>
      <div class="dim-grid">
        <div class="dim-item">🗣️ 文字沟通</div>
        <div class="dim-item">🧠 推理判断</div>
        <div class="dim-item">🗺️ 视觉构想</div>
        <div class="dim-item">🧘 内省感知</div>
        <div class="dim-item">🤝 关系洞察</div>
        <div class="dim-item">💪 动手实践</div>
        <div class="dim-item">🎵 音律敏感</div>
        <div class="dim-item">🌿 环境觉察</div>
        <div class="dim-item">💡 创意突破</div>
        <div class="dim-item">🎨 美学品味</div>
      </div>
      <button class="btn btn-primary" onclick="startQuiz()">开始探索</button>
      <p style="font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:12px;line-height:1.6">
        本工具仅供自我探索参考，不构成专业心理评估或职业建议。
      </p>
    </div>
  </section>

  <section id="screen-quiz" class="hidden">
    <div class="card">
      <div class="progress-info">
        <span id="progressText">第 1 / 50 题</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="btnPrev" onclick="prevQ()">上一题</button>
        <button class="btn btn-primary" id="btnNext" onclick="nextQ()">下一题</button>
      </div>
    </div>
  </section>

  <section id="screen-report" class="hidden">
    <div id="reportBody"></div>
    <button class="btn btn-ghost" onclick="resetAll()">重新测试</button>
  </section>

</div>

<script>
/* ============================================================
   1. 题库（按维度顺序存放，每 5 题为一组）
   ============================================================ */
const QUESTIONS_RAW = [
  // 维度0 · 文字沟通
  "我表达自己的想法时，别人通常能很快明白我的意思。",
  "读完一篇文章，我能很快说出它主要在讲什么。",
  "我习惯把想法写下来或讲出来，这样思路会更清楚。",
  "身边人常说听我说话很舒服、很容易理解。",
  "解释一个抽象概念时，我常能想到贴切的比喻或例子。",
  // 维度1 · 推理判断
  "遇到复杂情况，我习惯先梳理出里面的关键要素。",
  "我常会想\"为什么这件事会这样\"，而不只停留在表面。",
  "一堆零散信息摆在我面前，我常能发现它们之间有什么关联。",
  "做选择时，我会把几个方案的利弊摆出来对比。",
  "别人常说我善于抓住问题的要害。",
  // 维度2 · 视觉构想
  "我能在脑海里把一件东西转个方向，想象它不同角度的样子。",
  "看地图、示意图或结构图时，我很快就能理解它在表达什么。",
  "房间或桌面怎么摆更合理，我通常比较有感觉。",
  "去过一次的地方，我大致能凭记忆画出路线。",
  "我对物体的构造、部件之间的关系比较感兴趣。",
  // 维度3 · 内省感知
  "我能说清楚自己现在心情怎么样、为什么会这样。",
  "我经常在事后回想自己做过的选择和当时的想法。",
  "状态不好的时候，我知道做什么能让自己缓过来。",
  "我对\"自己到底想要什么\"这件事比较清楚。",
  "我习惯从过往经历中总结出一些对自己的认识。",
  // 维度4 · 关系洞察
  "别人还没开口，我有时就能感觉到他情绪不太对。",
  "朋友跟我倾诉时，我通常能明白他真正在意的是什么。",
  "到一个陌生的圈子，我一般能比较快地跟大家熟络起来。",
  "双方争执时，我能理解各自站在什么角度想问题。",
  "跟不同的人打交道，我会调整自己说话的方式。",
  // 维度5 · 动手实践
  "新学的动作（比如舞蹈、球类、手工），我上手比一般人快。",
  "我对自己身体的灵活度和协调性比较有信心。",
  "让我实际做一遍，比只听别人讲效果更好。",
  "我能比较精准地控制自己的动作幅度和节奏。",
  "我更喜欢边做边学、边动手边琢磨。",
  // 维度6 · 音律敏感
  "一首歌听上两三遍，我大概就能哼出它的旋律。",
  "我能感受到一段音乐里传递的情绪起伏。",
  "我对声音的高低、快慢、音色变化比较敏感。",
  "听歌时，我会留意到编曲或演唱里一些很细的处理。",
  "听过一段旋律或节奏，我能比较准确地复现出来。",
  // 维度7 · 环境觉察
  "我常能注意到身边环境里一些细微的变化。",
  "我对植物、动物或自然现象有种天然的好奇。",
  "待在大自然里，我会明显感觉整个人放松下来。",
  "我喜欢观察一件事物随着时间慢慢发生的变化。",
  "环境里出现异常，我经常是最早察觉到的人之一。",
  // 维度8 · 创意突破
  "我常能想到一些别人没往那方面想过的点子。",
  "遇到条条框框的限制，我反而更有动力找突破口。",
  "我喜欢把看起来不相关的领域拼在一起，产生新的想法。",
  "我对未知的领域有比较强的探索欲望。",
  "与其重复做熟悉的事，我更愿意尝试做出点新东西。",
  // 维度9 · 美学品味
  "看到一样东西，我很快能感觉出它\"好看\"还是\"别扭\"。",
  "颜色、比例、排版这些视觉细节，我平时会格外在意。",
  "我常会动手调整身边的物品或环境，让它看起来更舒服。",
  "看到一件优秀的设计作品，我能说出它好在哪里。",
  "我对\"东西应该长什么样\"有自己的审美标准。"
];

/* ============================================================
   2. 题目显示顺序（打乱后）
   数组里每个数字是原始题目索引，同一维度不连续出现。
   ============================================================ */
const SHUFFLED_ORDER = [
  26, 3, 42, 15, 38, 7, 49, 21, 11, 33,
  45, 1, 29, 17, 40, 5, 47, 23, 13, 36,
  30, 9, 44, 19, 2, 35, 27, 12, 46, 31,
  4, 22, 37, 10, 48, 24, 16, 41, 6, 28,
  34, 14, 0, 43, 20, 39, 8, 25, 32, 18
];

/* 组装题目对象：text 是题目内容，dim 是所属维度索引 */
const QUESTIONS = SHUFFLED_ORDER.map(idx => ({
  text: QUESTIONS_RAW[idx],
  dim: Math.floor(idx / 5)
}));

/* ============================================================
   3. 维度定义
   ============================================================ */
const DIM_KEYS = ["文字沟通","推理判断","视觉构想","内省感知","关系洞察","动手实践","音律敏感","环境觉察","创意突破","美学品味"];

/* ============================================================
   4. 维度文案库
   ============================================================ */
const DIM_DATA = {
  "文字沟通": {
    short: "沟通", icon: "🗣️", slogan: "把心里想的说明白，也是一种硬实力。",
    pros: ["开口就能让人听懂", "善于打比方、举例子", "写东西时逻辑顺、读着舒服"],

/* ============================================================
   7. 霍兰德代码映射
   ============================================================ */
function getHolland(top3) {
  const set = new Set(top3);
  const typeNames = { "A":"艺术型", "R":"现实型", "I":"研究型", "S":"社会型", "E":"企业型", "C":"常规型" };
  const typeDesc = {
    "A":"艺术型：创意表达、自由创作、偏好非结构化的工作",
    "R":"现实型：动手实践、操作工具、偏好具体任务",
    "I":"研究型：思考分析、探索原理、偏好研究式工作",
    "S":"社会型：助人合作、沟通教导、偏好服务与协作",
    "E":"企业型：影响他人、推动落地、偏好组织与决策",
    "C":"常规型：规则清晰、流程稳定、偏好有序与结构化"
  };
  let codes = [];
  if (set.has("创意突破") || set.has("美学品味") || set.has("音律敏感")) codes.push("A");
  if (set.has("动手实践") || set.has("环境觉察") || set.has("视觉构想")) codes.push("R");
  if (set.has("推理判断") || set.has("环境觉察")) codes.push("I");
  if (set.has("关系洞察") || set.has("内省感知")) codes.push("S");
  if (set.has("关系洞察") || set.has("创意突破")) codes.push("E");
  if (set.has("推理判断") || set.has("内省感知")) codes.push("C");
  codes = [...new Set(codes)].slice(0, 3);
  while (codes.length < 3) codes.push("A");
  return {
    code: codes.map(c => typeNames[c]).join(" + "),
    desc: codes.map(c => typeDesc[c]).join("；")
  };
}

   10. 分档
   ============================================================ */
function getTier(score) {
  if (score >= 20) return { label: "突出潜能", cls: "hi", stars: "★★★★★" };
  if (score >= 16) return { label: "较明显优势", cls: "mid", stars: "★★★★☆" };
  if (score >= 12) return { label: "一般倾向", cls: "lo", stars: "★★★☆☆" };
  return { label: "当前表现较弱", cls: "lo", stars: "★★☆☆☆" };
}

const OPTIONS = ["非常不像我","不太像我","一般 / 不确定","比较像我","非常像我"];
const TOTAL = QUESTIONS.length;
let answers = new Array(TOTAL).fill(null);
let current = 0;

(function load() {
  const saved = localStorage.getItem('potential_compass_v1');
  if (saved) {
    try { const arr = JSON.parse(saved); if (Array.isArray(arr) && arr.length === TOTAL) answers = arr; } catch(e){}
  }
})();

function show(id) {
  ['screen-home','screen-quiz','screen-report'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function startQuiz() {
  const firstUnanswered = answers.findIndex(a => a === null);
  current = firstUnanswered === -1 ? 0 : firstUnanswered;
  show('screen-quiz');
  renderQ();
}
function renderQ() {
  document.getElementById('qText').textContent = QUESTIONS[current].text;
  const pct = Math.round(((current + 1) / TOTAL) * 100);
  document.getElementById('progressText').textContent = `第 ${current + 1} / ${TOTAL} 题`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = `${pct}%`;

  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  OPTIONS.forEach((label, idx) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[current] === idx + 1 ? ' selected' : '');
    div.innerHTML = `<span class="dot"></span><span>${label}</span>`;
    div.onclick = () => { answers[current] = idx + 1; saveProgress(); renderQ(); };
    wrap.appendChild(div);
  });
  document.getElementById('btnPrev').style.visibility = current === 0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').textContent = current === TOTAL - 1 ? '生成报告' : '下一题';
}
function prevQ() { if (current > 0) { current--; renderQ(); } }
function nextQ() {
  if (answers[current] === null) { alert('请先选择一个选项'); return; }
  if (current < TOTAL - 1) { current++; renderQ(); }
  else finish();
}
function saveProgress() { localStorage.setItem('potential_compass_v1', JSON.stringify(answers)); }

/* ============================================================
   12. 计分（按维度聚合）
   ============================================================ */
function calcScores() {
  const sums = new Array(10).fill(0);
  QUESTIONS.forEach((q, i) => {
    sums[q.dim] += answers[i] === null ? 3 : answers[i];
  });
  return DIM_KEYS.map((name, i) => ({
    name, score: sums[i], pct: Math.round((sums[i] - 5) / 20 * 100)
  }));
}

function finish() {
  const answered = answers.filter(a => a !== null).length;
  if (answered < TOTAL) {
    if (!confirm(`还有 ${TOTAL - answered} 题未作答，未作答将按"一般"计分。确定生成报告吗？`)) return;
  }
  const scores = calcScores();
  const sorted = [...scores].sort((a, b) => b.score - a.score);
  const top3 = sorted.slice(0, 3).map(s => s.name);
  const bottom3 = sorted.slice(-3).map(s => s.name);
  renderReport(scores, sorted, top3, bottom3);
  show('screen-report');
}

/* ============================================================
   13. 雷达图 SVG
   ============================================================ */
function buildRadar(scores) {
  const cx = 160, cy = 140, R = 95;
  const N = 10;
  const angle = i => -Math.PI / 2 + i * 2 * Math.PI / N;
  const pt = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];

  let grid = "";
  [0.25, 0.5, 0.75, 1].forEach(scale => {
    const pts = [];
    for (let i = 0; i < N; i++) { const [x, y] = pt(i, R * scale); pts.push(`${x.toFixed(1)},${y.toFixed(1)}`); }
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="#d5ede4" stroke-width="1"/>`;
  });
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i, R);
    grid += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#d5ede4" stroke-width="1"/>`;
  }

  const dataPts = scores.map((s, i) => {
    const r = R * Math.max(0.1, s.pct / 100);
    const [x, y] = pt(i, r);
    return [x, y];
  });
  const dataPoly = dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const dots = dataPts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#2ea87c"/>`).join('');

  const labels = scores.map((s, i) => {
    const [x, y] = pt(i, R + 22);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#6b7280">${s.name} ${s.score}</text>`;
  }).join('');

  return `<svg viewBox="0 0 320 280" style="width:100%;max-width:360px;display:block;margin:0 auto">
    ${grid}
    <polygon points="${dataPoly}" fill="rgba(46,168,124,.18)" stroke="#2ea87c" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

/* ============================================================
   14. 工具函数
   ============================================================ */
function getFitOk(top3) {
  const pool = [];
  top3.forEach(d => { (DIM_DATA[d].scenes || []).forEach(s => pool.push(s)); });
  return [...new Set(pool)].slice(0, 4);
}

function getCareers(top3) {
  const pool = [];
  for (let i = 0; i < top3.length; i++) {
    for (let j = i + 1; j < top3.length; j++) {
      const key = careerKey(top3[i], top3[j]);
      if (CAREERS[key]) pool.push(...CAREERS[key]);
    }
  }
  const seen = new Set();
  const unique = pool.filter(c => { if (seen.has(c.name)) return false; seen.add(c.name); return true; });
  for (const f of FALLBACK_CAREERS) {
    if (unique.length >= 6) break;
    if (!seen.has(f.name)) { unique.push(f); seen.add(f.name); }
  }
  return unique.slice(0, 6);
}

function pickCautions(scores, n) {
  const sorted = [...scores].sort((a, b) => a.score - b.score);
  const bottom = sorted.slice(0, 3).map(s => s.name);
  const relevant = CAUTIONS.filter(c => {
    if (bottom.includes("推理判断") && /会计|数据|审核|测试|财务/.test(c.name)) return true;
    if (bottom.includes("动手实践") && /维修|健身|宠物/.test(c.name)) return true;
    if (bottom.includes("关系洞察") && /人力|公关|客服/.test(c.name)) return true;
    if (bottom.includes("视觉构想") && /室内|仓库/.test(c.name)) return true;
    if (bottom.includes("文字沟通") && /讲师|直播|公关/.test(c.name)) return true;
    if (bottom.includes("美学品味") && /婚礼|设计/.test(c.name)) return true;
    return false;
  });
  return (relevant.length >= n ? relevant.slice(0, n) : [...relevant, ...CAUTIONS].slice(0, n));
}

function resetAll() {
  if (!confirm('确定要清空所有作答记录，重新开始吗？')) return;
  answers = new Array(TOTAL).fill(null);
  current = 0;
  localStorage.removeItem('potential_compass_v1');
  show('screen-home');
}

document.addEventListener('keydown', e => {
  if (document.getElementById('screen-quiz').classList.contains('hidden')) return;
  if (e.key >= '1' && e.key <= '5') {
    answers[current] = parseInt(e.key);
    saveProgress(); renderQ();
  }
  if (e.key === 'ArrowLeft') prevQ();
  if (e.key === 'ArrowRight') nextQ();
});

function renderQuickCard(dim, scores) {
  const d = DIM_DATA[dim];
  const item = scores.find(s => s.name === dim);
  const tier = getTier(item.score);
  const otherDims = scores.filter(s => s.name !== dim).slice(0, 3).map(s => s.name);

  const synergyHtml = otherDims.slice(0, 2).map(o =>
    `<div class="syn-row"><b>+ ${o}</b>　${getSynergy(dim, o)}</div>`
  ).join("");

  const prosHtml = d.pros.map(p => `<span class="qc-ok">${p}</span>`).join("");
  const consHtml = d.cons.map(c => `<span class="qc-warn">${c}</span>`).join("");
  const featuresHtml = d.features.map(f => `<li>${f}</li>`).join("");
  const expHtml = d.exp.map(e => `<li>${e}</li>`).join("");
  const scenesHtml = d.scenes.map(s => `<span class="chip">${s}</span>`).join("");
  const adviceHtml = d.advice.map(a => `<li>${a}</li>`).join("");

  return `
    <div class="quick-card">
      <div class="quick-head">
        <div class="e">${d.icon}</div>
        <div style="flex:1">
          <b>${dim}</b>
          <span class="stars">${tier.stars}</span>
          <span class="ss">${item.score}/25 · ${tier.label}</span>
        </div>
      </div>
      <div class="quick-slogan">${d.slogan}</div>
      <div class="qc-title yes">你的优势</div>
      ${prosHtml}
      <div class="qc-title no">可能卡点</div>
      ${consHtml}
      <details class="qc-more">
        <summary>展开详细分析</summary>
        <div class="qc-detail">
          <p>${d.desc}</p>
          <div class="d-sec"><b>你可能有的特征</b><ul class="d-list">${featuresHtml}</ul></div>
          <div class="d-sec"><b>你可能有这些经历</b><ul class="d-list">${expHtml}</ul></div>
          <div class="d-sec"><b>最佳应用场景</b><div style="margin-top:4px">${scenesHtml}</div></div>
          <div class="d-sec"><b>发挥建议</b><ul class="d-list">${adviceHtml}</ul></div>
          <div class="d-sec"><b>与其他优势的协同</b>${synergyHtml}</div>
          <div class="work-mode"><b>💼 你的典型工作模式</b><p>${d.workMode}</p></div>
        </div>
      </details>
    </div>
  `;
}
